name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! DexPresenter is a one-person spare-time project — clear, reproducible reports are the ones most likely to get fixed (see [CONTRIBUTING.md](../blob/main/docs/CONTRIBUTING.md)).
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2 (26100.2033)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: DexPresenter version
      description: Shown in the installer name, release page, or the exe's file properties.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: Installation type
      options:
        - Installer
        - Portable exe
        - Built from source
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Draw tool with Ctrl+2
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Screenshots help a lot, especially for rendering or layout issues.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Multi-monitor setup, DPI scaling, other overlay/annotation tools running, etc.
