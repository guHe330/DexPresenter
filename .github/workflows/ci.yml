name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    # windows-2022 (VS 2022) is the toolchain of record: it matches local dev
    # and the release build. windows-latest (VS 2026 since the 2026-07 image
    # roll) runs alongside it as advance warning only and must never block a
    # merge -- promote it to the pinned image once it has been green a while.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: windows-2022
            blocking: true
          - image: windows-latest
            blocking: false

    name: build-and-test (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    continue-on-error: ${{ !matrix.blocking }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup CMake
      uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

    # No -G: let CMake pick the newest Visual Studio on the runner, so the same
    # step works on both images. Pinning "Visual Studio 17 2022" broke configure
    # outright the moment windows-latest rolled to VS 2026.
    - name: Configure CMake
      run: cmake -S . -B build -A x64

    - name: Build Release
      run: cmake --build build --config Release

    - name: Run tests
      shell: pwsh
      run: |
        & "build/Release/DexPresenterTests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

    # Only the pinned leg publishes; both legs would collide on artifact name.
    - name: Upload executable
      if: matrix.blocking
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: DexPresenter-${{ github.sha }}
        path: build/Release/DexPresenter.exe
        retention-days: 14

  # Second compiler for extra warning coverage; MSVC remains the release compiler.
  build-clang-cl:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Setup CMake
      uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

    - name: Setup MSVC environment (headers/libs for clang-cl)
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: x64

    - name: Configure CMake (clang-cl preset)
      run: cmake --preset clang

    - name: Build Release
      run: cmake --build --preset clang

    - name: Run tests
      shell: pwsh
      run: |
        & "build-clang/DexPresenterTests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
