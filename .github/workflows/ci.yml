name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build build --config Release

    - name: Run tests
      shell: pwsh
      run: |
        & "build/Release/DexPresenterTests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Tests failed" }

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: DexPresenter-${{ github.sha }}
        path: build/Release/DexPresenter.exe
        retention-days: 14

  # Second compiler for extra warning coverage; MSVC remains the release compiler.
  build-clang-cl:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Setup MSVC environment (headers/libs for clang-cl)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake (clang-cl preset)
      run: cmake --preset clang

    - name: Build Release
      run: cmake --build --preset clang

    - name: Run tests
      shell: pwsh
      run: |
        & "build-clang/DexPresenterTests.exe"
        if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
