name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # OIDC token Sigstore uses to sign the provenance
  attestations: write  # write the attestation to the repo's attestation store

jobs:
  build:
    # Pinned deliberately, NOT windows-latest: release binaries are built with
    # the same VS 2022 toolchain used locally, so static-CRT codegen and the
    # sub-500 KB exe budget stay predictable. Move this only on purpose, after
    # the advisory windows-latest leg in ci.yml has been green.
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    # Pinned, not @latest: an unpinned CMake can raise its minimum-supported
    # cmake_minimum_required out from under us with no warning, exactly how the
    # VS 2026 image roll broke configure. CMakeLists.txt asks for 3.21.
    - name: Setup CMake
      uses: lukka/get-cmake@v4.4.0

    - name: Get version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        Write-Host "Version: $version (tag: $tag)"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    - name: Update CMakeLists.txt version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $cmakePath = "CMakeLists.txt"
        $content = Get-Content $cmakePath -Raw
        $content = $content -replace 'project\(DexPresenter VERSION \d+\.\d+\.\d+', "project(DexPresenter VERSION $version"
        Set-Content $cmakePath -Value $content
        Write-Host "Updated CMakeLists.txt to version $version"

    - name: Update Version.h
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $parts = $version -split '\.'
        $major = $parts[0]
        $minor = $parts[1]
        $patch = $parts[2]
        $versionH = "src/Version.h"
        $content = Get-Content $versionH -Raw
        $content = $content -replace '#define DEXPRESENTER_VERSION\s+L"[^"]*"', "#define DEXPRESENTER_VERSION       L""$version"""
        $content = $content -replace '#define DEXPRESENTER_VERSION_MAJOR \d+', "#define DEXPRESENTER_VERSION_MAJOR $major"
        $content = $content -replace '#define DEXPRESENTER_VERSION_MINOR \d+', "#define DEXPRESENTER_VERSION_MINOR $minor"
        $content = $content -replace '#define DEXPRESENTER_VERSION_PATCH \d+', "#define DEXPRESENTER_VERSION_PATCH $patch"
        Set-Content $versionH -Value $content
        Write-Host "Updated Version.h to $version"

    - name: Update RC file version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $parts = $version -split '\.'
        $major = $parts[0]; $minor = $parts[1]; $patch = $parts[2]
        $commaVer = "$major,$minor,$patch,0"
        $dotVer   = "$major.$minor.$patch.0"

        $rcFile = "resources/DexPresenter.rc"
        $content = Get-Content $rcFile -Raw
        $content = $content -replace 'FILEVERSION\s+[\d,]+',    "FILEVERSION     $commaVer"
        $content = $content -replace 'PRODUCTVERSION\s+[\d,]+', "PRODUCTVERSION  $commaVer"
        $content = $content -replace '"FileVersion",\s+"[^"]*"',    """FileVersion"",       ""$dotVer"""
        $content = $content -replace '"ProductVersion",\s+"[^"]*"', """ProductVersion"",    ""$dotVer"""
        Set-Content $rcFile -Value $content
        Write-Host "Updated $rcFile to $dotVer"

    # No -G: let CMake pick the VS on the runner, so pinning the toolchain is
    # done in one place (runs-on above) rather than two.
    - name: Configure CMake
      run: cmake -S . -B build -A x64

    - name: Build Release
      run: cmake --build build --config Release

    - name: Run Tests
      shell: pwsh
      run: |
        $testExe = "build/Release/DexPresenterTests.exe"
        if (Test-Path $testExe) {
          & $testExe
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
          Write-Host "All tests passed"
        } else {
          Write-Host "Test executable not found, skipping tests"
        }

    - name: Prepare portable readme
      shell: pwsh
      run: |
        Copy-Item "Distribute/PortableReadme.txt" -Destination "portable_readme.txt"
        Write-Host "Copied PortableReadme.txt for portable package"

    - name: Create Portable Package
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"

        # Create staging directory
        New-Item -ItemType Directory -Force -Path "package"

        # Copy files
        Copy-Item "build/Release/DexPresenter.exe" -Destination "package/"
        Copy-Item "LICENSE" -Destination "package/"
        Copy-Item "portable_readme.txt" -Destination "package/readme.txt"

        # Create zip
        Compress-Archive -Path "package/*" -DestinationPath "Portable_DexPresenter.zip" -Force

        Write-Host "Created Portable_DexPresenter.zip with contents:"
        Get-ChildItem "package"

    - name: Build Inno Setup Installer
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        Write-Host "Building Inno Setup installer version $version"

        # Copy build output to where the .iss expects it (build/)
        # VS generator puts output in Release/ subfolder
        Copy-Item "build/Release/DexPresenter.exe" -Destination "build/" -Force

        # Create a complete, buildable source archive for GPL distribution.
        # Must match the file list in build.ps1 so installer-only recipients
        # receive the complete corresponding source they can rebuild from.
        $archiveItems = @(
          "src",
          "tests",
          "resources",
          "installer",
          "CMakeLists.txt",
          "CMakePresets.json",
          "README.md",
          "LICENSE",
          "PRIVACY.md",
          "build.ps1",
          ".gitignore"
        )
        $filesToZip = $archiveItems | Where-Object { Test-Path $_ }
        Compress-Archive -Path $filesToZip -DestinationPath "build/DexPresenter_Sources.zip" -Force

        # Inno Setup 6 is pre-installed on windows-latest runners
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version "installer\innosetup\DexPresenter.iss"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

        $setupFile = "installer\innosetup\output\DexPresenter_${version}_Setup.exe"
        if (Test-Path $setupFile) {
          Copy-Item $setupFile "DexPresenter_${version}_Setup.exe"
          Write-Host "Installer created: DexPresenter_${version}_Setup.exe"
        } else {
          Write-Error "Installer not found at $setupFile"
          exit 1
        }

    # Build provenance only — this is NOT Authenticode and does nothing for the
    # SmartScreen warning documented in the README. It lets anyone confirm the
    # published binaries came out of this tag's Actions run:
    #   gh attestation verify <file> --repo guHe330/DexPresenter
    # The bare exe is listed alongside the packages so it stays verifiable after
    # the portable zip is unpacked (attestations bind to the file digest).
    - name: Attest build provenance
      uses: actions/attest@v4
      with:
        subject-path: |
          Portable_DexPresenter.zip
          DexPresenter_${{ steps.get_version.outputs.version }}_Setup.exe
          build/Release/DexPresenter.exe

    - name: Prepare release notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $body = Get-Content "Distribute/RELEASE_TEMPLATE.md" -Raw
        $body = $body -replace '\$\{VERSION\}', $version
        Set-Content "release_notes.md" -Value $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: DexPresenter ${{ steps.get_version.outputs.tag }}
        body_path: release_notes.md
        files: |
          Portable_DexPresenter.zip
          DexPresenter_${{ steps.get_version.outputs.version }}_Setup.exe
        draft: false
        # Alpha status (see README) — flip to false once the project leaves alpha.
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
