name: Build and Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write      # create the GitHub Release
  id-token: write      # OIDC token Sigstore uses to sign the provenance
  attestations: write  # write the attestation to the repo's attestation store

# Every action is pinned to a full commit SHA, not a tag. Tags are mutable: a
# compromised upstream could move v4 and run arbitrary code in this job, which
# holds contents:write and signs the provenance for the published binaries.
# security-guards.yml fails the build if an unpinned `uses:` ever reappears.

jobs:
  build:
    # Pinned deliberately, NOT windows-latest: release binaries are built with
    # the same VS 2022 toolchain used locally, so static-CRT codegen and the
    # sub-500 KB exe budget stay predictable. Move this only on purpose, after
    # the advisory windows-latest leg in ci.yml has been green.
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        fetch-depth: 0  # Fetch all history for tags

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    # Pinned, not @latest: an unpinned CMake can raise its minimum-supported
    # cmake_minimum_required out from under us with no warning, exactly how the
    # VS 2026 image roll broke configure. CMakeLists.txt asks for 3.21.
    - name: Setup CMake
      uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3 # v4.4.0

    - name: Get version from tag
      id: get_version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag -replace '^v', ''
        Write-Host "Version: $version (tag: $tag)"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "tag=$tag" >> $env:GITHUB_OUTPUT

    # The version is READ from the repository, never written into it. src/Version.h
    # is the single source of truth (CMakeLists.txt parses it, DexPresenter.rc
    # includes it), so the tagged commit already describes the binary it produces.
    # Rewriting these files at build time would mean the published artifacts came
    # from a tree that exists nowhere in git -- which the provenance attestation
    # below would then happily vouch for.
    - name: Verify Version.h matches the tag
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $parts = $version -split '\.'
        if ($parts.Count -ne 3) { throw "Tag version '$version' is not X.Y.Z" }
        $major, $minor, $patch = $parts

        $versionH = Get-Content "src/Version.h" -Raw

        if ($versionH -notmatch '#define DEXPRESENTER_VERSION\s+L"([^"]*)"') {
            throw "Could not find DEXPRESENTER_VERSION in src/Version.h"
        }
        if ($Matches[1] -ne $version) {
            throw "Tag v$version does not match src/Version.h ($($Matches[1])). Bump Version.h and commit it before tagging."
        }

        $checks = @{
            'DEXPRESENTER_VERSION_MAJOR' = $major
            'DEXPRESENTER_VERSION_MINOR' = $minor
            'DEXPRESENTER_VERSION_PATCH' = $patch
        }
        foreach ($name in $checks.Keys) {
            if ($versionH -notmatch "#define $name\s+(\d+)") { throw "Could not find $name in src/Version.h" }
            if ($Matches[1] -ne $checks[$name]) {
                throw "$name is $($Matches[1]) but the tag says $($checks[$name])"
            }
        }

        if ($versionH -notmatch '#define DEXPRESENTER_VERSION_COMMA\s+([\d,]+)') {
            throw "Could not find DEXPRESENTER_VERSION_COMMA in src/Version.h"
        }
        if ($Matches[1] -ne "$major,$minor,$patch,0") {
            throw "DEXPRESENTER_VERSION_COMMA is $($Matches[1]), expected $major,$minor,$patch,0"
        }

        if ($versionH -notmatch '#define DEXPRESENTER_VERSION_DOTTED\s+"([^"]*)"') {
            throw "Could not find DEXPRESENTER_VERSION_DOTTED in src/Version.h"
        }
        if ($Matches[1] -ne "$major.$minor.$patch.0") {
            throw "DEXPRESENTER_VERSION_DOTTED is $($Matches[1]), expected $major.$minor.$patch.0"
        }

        Write-Host "Version OK: src/Version.h is consistent with tag v$version"

    # The release notes are assembled from docs/CHANGELOG.md, so a release cannot ship
    # without its section having been written. Checked before the build, so the
    # failure arrives in seconds rather than after a full compile.
    - name: Verify the changelog has a section for this version
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        $changelog = Get-Content "docs/CHANGELOG.md" -Raw
        if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($version))\]") {
            throw "docs/CHANGELOG.md has no '## [$version]' section. Write the release notes before tagging."
        }
        Write-Host "docs/CHANGELOG.md has a section for $version"

    # No -G: let CMake pick the VS on the runner, so pinning the toolchain is
    # done in one place (runs-on above) rather than two.
    - name: Configure CMake
      run: cmake -S . -B build -A x64

    - name: Build Release
      run: cmake --build build --config Release

    # No "skip if missing" fallback: a release that quietly ships untested
    # binaries because the test exe failed to build is the exact outcome this
    # step exists to prevent.
    - name: Run Tests
      shell: pwsh
      run: |
        $testExe = "build/Release/DexPresenterTests.exe"
        if (-not (Test-Path $testExe)) { throw "Test executable not found at $testExe" }
        & $testExe
        if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
        Write-Host "All tests passed"

    # One script owns what "complete corresponding source" means; build.ps1 calls
    # the same one, so a locally built archive and a released one are identical.
    # It fails loudly on a missing path or a leaked binary rather than shipping a
    # short archive, because GPLv3 section 6 makes this a licence obligation.
    - name: Create GPL source archive
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        ./Distribute/New-SourceArchive.ps1 -OutputPath build/DexPresenter_Sources.zip
        # A second, version-stamped copy is published as its own release asset,
        # so the source is reachable without downloading a binary first.
        Copy-Item "build/DexPresenter_Sources.zip" "DexPresenter_${version}_Sources.zip" -Force

    # The source ships *inside* the portable zip as well as with the installer.
    # A portable user who never runs Setup still received a binary, and section 6
    # attaches to that binary regardless of how it was packaged.
    - name: Create Portable Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "package" | Out-Null

        Copy-Item "build/Release/DexPresenter.exe" -Destination "package/"
        Copy-Item "LICENSE" -Destination "package/"
        Copy-Item "THIRD_PARTY_NOTICES.txt" -Destination "package/"
        Copy-Item "build/DexPresenter_Sources.zip" -Destination "package/"
        Copy-Item "Distribute/PortableReadme.txt" -Destination "package/readme.txt"

        Compress-Archive -Path "package/*" -DestinationPath "Portable_DexPresenter.zip" -Force

        Write-Host "Created Portable_DexPresenter.zip with contents:"
        Get-ChildItem "package"

    - name: Build Inno Setup Installer
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"
        Write-Host "Building Inno Setup installer version $version"

        # Copy build output to where the .iss expects it (build/)
        # VS generator puts output in Release/ subfolder
        Copy-Item "build/Release/DexPresenter.exe" -Destination "build/" -Force

        # build/DexPresenter_Sources.zip was produced by the step above; the .iss
        # picks it up from there and installs it next to the executable.

        # Inno Setup 6 is pre-installed on the Windows runners
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$version "installer\innosetup\DexPresenter.iss"
        if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

        $setupFile = "installer\innosetup\output\DexPresenter_${version}_Setup.exe"
        if (-not (Test-Path $setupFile)) { throw "Installer not found at $setupFile" }
        Copy-Item $setupFile "DexPresenter_${version}_Setup.exe"
        Write-Host "Installer created: DexPresenter_${version}_Setup.exe"

    # Build provenance only -- this is NOT Authenticode and does nothing for the
    # SmartScreen warning documented in the README. It lets anyone confirm the
    # published binaries came out of this tag's Actions run:
    #   gh attestation verify <file> --repo guHe330/DexPresenter
    # The bare exe is listed alongside the packages so it stays verifiable after
    # the portable zip is unpacked (attestations bind to the file digest).
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          Portable_DexPresenter.zip
          DexPresenter_${{ steps.get_version.outputs.version }}_Setup.exe
          DexPresenter_${{ steps.get_version.outputs.version }}_Sources.zip
          build/Release/DexPresenter.exe

    - name: Prepare release notes
      shell: pwsh
      run: |
        $version = "${{ steps.get_version.outputs.version }}"

        # Sizes and checksums are measured from the artifacts this run just
        # produced, so the download table cannot drift from what ships. The
        # binaries are unsigned, so a SHA-256 is the only integrity check a
        # downloader can perform before running them.
        function Format-Size([string]$path) {
            if (-not (Test-Path $path)) { throw "Cannot size missing artifact: $path" }
            $bytes = (Get-Item $path).Length
            # Invariant culture: release notes always read "2.3 MB", never the
            # runner locale's decimal comma.
            $inv = [cultureinfo]::InvariantCulture
            if ($bytes -ge 1MB) { return ($bytes / 1MB).ToString("N1", $inv) + " MB" }
            return ($bytes / 1KB).ToString("N0", $inv) + " KB"
        }

        function Get-Sha([string]$path) {
            if (-not (Test-Path $path)) { throw "Cannot hash missing artifact: $path" }
            return (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
        }

        $setup    = "DexPresenter_${version}_Setup.exe"
        $portable = "Portable_DexPresenter.zip"
        $sources  = "DexPresenter_${version}_Sources.zip"

        # Lift this version's section out of docs/CHANGELOG.md: everything between its
        # own "## [x.y.z]" heading and the next "## " heading.
        $changelog = Get-Content "docs/CHANGELOG.md" -Raw
        $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## |\z)"
        if ($changelog -notmatch $pattern) {
            throw "Could not extract the $version section from docs/CHANGELOG.md"
        }
        $whatsNew = $Matches[1].Trim()

        $body = Get-Content "Distribute/RELEASE_TEMPLATE.md" -Raw
        $body = $body -replace '\$\{VERSION\}', $version
        $body = $body -replace '\$\{SETUP_SIZE\}', (Format-Size $setup)
        $body = $body -replace '\$\{PORTABLE_SIZE\}', (Format-Size $portable)
        $body = $body -replace '\$\{SETUP_SHA256\}', (Get-Sha $setup)
        $body = $body -replace '\$\{PORTABLE_SHA256\}', (Get-Sha $portable)
        $body = $body -replace '\$\{SOURCES_SIZE\}', (Format-Size $sources)
        # Last, and with a plain replace: changelog text may contain regex
        # metacharacters and $-sequences that -replace would try to expand.
        $body = $body.Replace('${CHANGELOG}', $whatsNew)

        Set-Content "release_notes.md" -Value $body
        Write-Host $body

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: DexPresenter ${{ steps.get_version.outputs.tag }}
        body_path: release_notes.md
        files: |
          Portable_DexPresenter.zip
          DexPresenter_${{ steps.get_version.outputs.version }}_Setup.exe
          DexPresenter_${{ steps.get_version.outputs.version }}_Sources.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
